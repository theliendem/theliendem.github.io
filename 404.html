<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>404 Not Found | Neil Dembla</title>
	<meta name="robots" content="noindex">
	<meta name="author" content="Neil Dembla">
	<meta name="theme-color" content="#000000">

	<link rel="icon" href="/assets/favicon.png" type="image/png" sizes="96x96">
	<link rel="icon" href="/favicon.ico" sizes="48x48">
	<link rel="apple-touch-icon" href="/apple-touch-icon.png">
	<link rel="stylesheet" type="text/css" href="/style.css">

	<!-- Comment out this script to remove typing animation -->
	<script src="/script.js" defer></script>
	<noscript><style>#hidden-content { visibility: visible; }</style></noscript>

	<!-- For social icons -->
	<script src="https://kit.fontawesome.com/1bba239c66.js" crossorigin="anonymous"></script>
</head>

<body>
	<script id="replace_with_navbar" src="/js/add_nav.js"></script>

	<main class="typing">
		<div id="hidden-content">
			<!-- Display code -->
			<h1>&lt;/404&gt;</h1> <br><br>
			<h2>The page you're looking for doesn't exist.</h2> <br>
			<a href="/">Take me back</a>
		</div>

		<div id="content" aria-hidden="true">

		</div>
	</main>

	<script>
		function showSidebar() {
			const sidebar = document.querySelector(".sidebar");
			sidebar.style.display = "flex";
		}

		function hideSidebar() {
			const sidebar = document.querySelector(".sidebar");
			sidebar.style.display = "none";
		}
	</script>
	<style>
		main {
			font-style: italic;
		}
		h1 {
			font-size: 7rem;
		}
		h2 {
			font-size: 2.5rem;
		}
		a {
			font-size: 2rem;
		}
	</style>

	<script id="replace_with_footer" src="/js/add_footer.js"></script>
</body>

</html>
